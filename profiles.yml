# dbt/profiles.yml
#
# tells dbt how to connect to duckdb.
# the database file lives in /opt/airflow/data/ (mounted from ./data/ on your host).
# this file is committed to git because it contains no secrets.

job_market:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: /opt/airflow/data/lake.duckdb
      threads: 4
